<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="uploads/palmas-icon.png">
<title>Palmas.ps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--page-bg:#edeef0;--heading:#141414;--body-dim:rgba(20,20,22,.55);--card:#ffffff;--card-border:rgba(20,20,22,.1);--field-bg:#ffffff;--field-border:rgba(20,20,22,.18);--field-fg:#141414;--nav-text:#2a2a2c;--glass-bg:rgba(20,20,22,.05);--glass-border:rgba(20,20,22,.14);--hairline:rgba(20,20,22,.1);--accent-ink:#b53a0f;--footer-base:#101013;--auth-bg:radial-gradient(circle at 20% 15%,#f4f5f7 0%,#edeef0 55%,#e2e4e7 100%)}
html[data-theme='dark']{--page-bg:#0d0d0f;--heading:#f7f7f5;--body-dim:rgba(247,247,245,.55);--card:rgba(255,255,255,.055);--card-border:rgba(255,255,255,.14);--field-bg:rgba(255,255,255,.06);--field-border:rgba(255,255,255,.16);--field-fg:#f7f7f5;--nav-text:#ededeb;--glass-bg:rgba(255,255,255,.08);--glass-border:rgba(255,255,255,.16);--hairline:rgba(255,255,255,.14);--accent-ink:#ffcdb0;--footer-base:#000000;--auth-bg:radial-gradient(circle at 20% 15%,#1a1a1d 0%,#0d0d0f 55%,#000000 100%)}
html,body{margin:0;padding:0;background:var(--page-bg);transition:background .5s ease}
*{box-sizing:border-box}
a{color:#f68743;text-decoration:none}
a:hover{color:#ffab7a}
::selection{background:#f68743;color:#121212}
input,select{font-family:'Cairo',sans-serif}
input::placeholder{color:var(--body-dim)}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes floatOrb{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.95)}}
@keyframes floatOrb2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-40px) scale(1.12)}}
@keyframes panelIn{from{opacity:0;transform:translateY(34px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.otp-box{width:46px;height:56px;text-align:center;font-size:22px;font-weight:800;border-radius:14px;border:1.5px solid var(--field-border);background:var(--field-bg);color:var(--field-fg);outline:none;transition:border-color .3s ease,box-shadow .3s ease}
.otp-box:focus{border-color:#f68743;box-shadow:0 0 0 4px rgba(246,135,67,.18)}
</style>
<script src="palmas-core.js"></script>
<script src="palmas-config.js"></script>
<script src="palmas-backend.js"></script>
</helmet>
<div dir="{{ dir }}" style="position:relative;font-family:'Cairo',sans-serif;min-height:100vh;color:var(--heading);overflow:hidden;display:flex;flex-direction:column;background:var(--auth-bg);transition:background .5s ease,color .5s ease">

<div style="position:absolute;top:-120px;inset-inline-start:-100px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(246,135,67,.28),transparent 65%);filter:blur(30px);animation:floatOrb 14s ease-in-out infinite;pointer-events:none"></div>
<div style="position:absolute;bottom:-140px;inset-inline-end:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(246,135,67,.18),transparent 65%);filter:blur(36px);animation:floatOrb2 18s ease-in-out infinite;pointer-events:none"></div>
<div style="position:absolute;top:30%;inset-inline-end:12%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(127,211,255,.12),transparent 65%);filter:blur(28px);animation:floatOrb 20s ease-in-out infinite;pointer-events:none"></div>

<dc-import name="SiteHeader" dir="{{ dir }}" hint-size="100%,68px"></dc-import>

<main style="position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:20px 24px 60px">
  <div key="{{ mode }}" style="width:100%;max-width:460px;background:var(--card);backdrop-filter:blur(22px);border:1px solid var(--card-border);border-radius:26px;padding:38px 36px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:panelIn .6s cubic-bezier(.25,.8,.35,1) both">

    <sc-if value="{{ isAuth }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:18px;padding:5px;margin-bottom:28px">
        <button onClick="{{ goLogin }}" style="flex:1;border:none;border-radius:14px;padding:11px;font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;cursor:pointer;background:{{ loginTabBg }};color:{{ loginTabColor }};transition:all .4s cubic-bezier(.25,.8,.35,1)">{{ t.loginTab }}</button>
        <button onClick="{{ goSignup }}" style="flex:1;border:none;border-radius:14px;padding:11px;font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;cursor:pointer;background:{{ signupTabBg }};color:{{ signupTabColor }};transition:all .4s cubic-bezier(.25,.8,.35,1)">{{ t.signupTab }}</button>
      </div>
    </sc-if>

    <sc-if value="{{ showBackArrow }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ goBack }}" style="display:flex;align-items:center;gap:6px;border:none;background:none;cursor:pointer;color:#f68743;font-family:'Cairo',sans-serif;font-weight:700;font-size:13.5px;padding:0;margin-bottom:14px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="transform:{{ backArrowFlip }}"><path d="M15 18l-6-6 6-6"></path></svg>
        {{ t.back }}
      </button>
    </sc-if>

    <div style="text-align:center;margin-bottom:26px">
      <h1 style="margin:0;font-size:27px;font-weight:800;color:var(--heading)">{{ heading }}</h1>
      <p style="margin:8px 0 0;font-size:14.5px;color:var(--body-dim);line-height:1.9">{{ subheading }}</p>
    </div>

    <sc-if value="{{ isCred }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:4px;margin-bottom:18px">
        <button type="button" onClick="{{ setMethodEmail }}" style="flex:1;border:none;border-radius:10px;padding:9px;font-family:'Cairo',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;background:{{ methodEmailBg }};color:{{ methodEmailColor }};transition:all .3s ease">{{ t.byEmail }}</button>
        <button type="button" onClick="{{ setMethodPhone }}" style="flex:1;border:none;border-radius:10px;padding:9px;font-family:'Cairo',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;background:{{ methodPhoneBg }};color:{{ methodPhoneColor }};transition:all .3s ease">{{ t.byPhone }}</button>
      </div>
    </sc-if>

    <sc-if value="{{ isCred }}" hint-placeholder-val="{{ true }}">
    <form onSubmit="{{ submit }}" ref="{{ formRef }}" style="display:flex;flex-direction:column;gap:16px">
      <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
        <input ref="{{ nameRef }}" placeholder="{{ t.fName }}" style="border:1.5px solid var(--field-border);border-radius:14px;padding:14px 18px;font-size:15px;outline:none;background:var(--field-bg);color:var(--field-fg);transition:border-color .3s ease,box-shadow .3s ease,background .3s ease" style-focus="border-color:#f68743;background:var(--glass-bg);box-shadow:0 0 0 4px rgba(246,135,67,.18)">
      </sc-if>

      <sc-if value="{{ isEmail }}" hint-placeholder-val="{{ true }}">
        <input ref="{{ emailRef }}" type="email" placeholder="{{ t.fEmail }}" style="border:1.5px solid var(--field-border);border-radius:14px;padding:14px 18px;font-size:15px;outline:none;background:var(--field-bg);color:var(--field-fg);transition:border-color .3s ease,box-shadow .3s ease,background .3s ease" style-focus="border-color:#f68743;background:var(--glass-bg);box-shadow:0 0 0 4px rgba(246,135,67,.18)">
      </sc-if>
      <sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;gap:8px;direction:ltr">
          <select value="{{ countryCode }}" onChange="{{ onCountryCode }}" style="width:130px;border:1.5px solid var(--field-border);border-radius:14px;padding:14px 8px;font-size:14px;outline:none;background:var(--field-bg);color:var(--field-fg);cursor:pointer">
            <sc-for list="{{ countryCodes }}" as="cc" hint-placeholder-count="10">
              <option value="{{ cc.code }}">{{ cc.label }}</option>
            </sc-for>
          </select>
          <input ref="{{ phoneRef }}" type="tel" placeholder="{{ t.fPhone }}" style="flex:1;min-width:0;text-align:start;border:1.5px solid var(--field-border);border-radius:14px;padding:14px 18px;font-size:15px;outline:none;background:var(--field-bg);color:var(--field-fg);transition:border-color .3s ease,box-shadow .3s ease,background .3s ease" style-focus="border-color:#f68743;background:var(--glass-bg);box-shadow:0 0 0 4px rgba(246,135,67,.18)">
        </div>
      </sc-if>

      <div style="position:relative">
        <input ref="{{ passRef }}" type="{{ passType }}" placeholder="{{ t.fPass }}" style="width:100%;border:1.5px solid var(--field-border);border-radius:14px;padding:14px 18px;padding-inline-end:52px;font-size:15px;outline:none;background:var(--field-bg);color:var(--field-fg);transition:border-color .3s ease,box-shadow .3s ease,background .3s ease" style-focus="border-color:#f68743;background:var(--glass-bg);box-shadow:0 0 0 4px rgba(246,135,67,.18)">
        <button type="button" onClick="{{ togglePass }}" title="{{ t.showPass }}" style="position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:12px;width:32px;height:32px;border:none;border-radius:50%;background:var(--glass-bg);color:var(--body-dim);cursor:pointer;display:grid;place-items:center;transition:background .3s ease" style-hover="background:rgba(246,135,67,.3)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>

      <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-4px">
          <button type="button" onClick="{{ toggleRemember }}" style="display:flex;align-items:center;gap:9px;border:none;background:none;cursor:pointer;color:var(--body-dim);font-family:'Cairo',sans-serif;font-size:13.5px;font-weight:600;padding:0">
            <span style="width:20px;height:20px;border-radius:6px;border:1.5px solid {{ rememberBorder }};background:{{ rememberBg }};display:grid;place-items:center;color:#121212;font-size:13px;font-weight:900;transition:all .3s cubic-bezier(.25,.8,.35,1)">{{ rememberMark }}</span>
            {{ t.remember }}
          </button>
          <button type="button" onClick="{{ goForgot }}" style="border:none;background:none;cursor:pointer;color:#f68743;font-family:'Cairo',sans-serif;font-size:13.5px;font-weight:700;padding:0;transition:color .3s ease" style-hover="color:#ffab7a">{{ t.forgot }}</button>
        </div>
      </sc-if>

      <sc-if value="{{ formError }}" hint-placeholder-val="{{ false }}">
        <div style="color:#e0245e;font-size:13px;font-weight:700">{{ formError }}</div>
      </sc-if>

      <button type="submit" style="margin-top:6px;background:linear-gradient(135deg,#f68743,#d1662a);border:none;border-radius:16px;padding:15px;font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;color:#121212;cursor:pointer;box-shadow:0 10px 26px rgba(246,135,67,.3);transition:transform .45s cubic-bezier(.25,.8,.35,1),box-shadow .45s ease,filter .3s ease" style-hover="transform:translateY(-3px);box-shadow:0 16px 36px rgba(246,135,67,.45);filter:brightness(1.06)" style-active="transform:translateY(0)">{{ ctaLabel }}</button>

    </form>
    </sc-if>

    <sc-if value="{{ isForgotMethod }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:4px;margin-bottom:18px">
        <button type="button" onClick="{{ setMethodEmail }}" style="flex:1;border:none;border-radius:10px;padding:9px;font-family:'Cairo',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;background:{{ methodEmailBg }};color:{{ methodEmailColor }};transition:all .3s ease">{{ t.byEmail }}</button>
        <button type="button" onClick="{{ setMethodPhone }}" style="flex:1;border:none;border-radius:10px;padding:9px;font-family:'Cairo',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;background:{{ methodPhoneBg }};color:{{ methodPhoneColor }};transition:all .3s ease">{{ t.byPhone }}</button>
      </div>
      <form onSubmit="{{ submitForgotMethod }}" ref="{{ formRef }}" style="display:flex;flex-direction:column;gap:16px">
        <sc-if value="{{ isEmail }}" hint-placeholder-val="{{ true }}">
          <input ref="{{ emailRef }}" type="email" placeholder="{{ t.fEmail }}" style="border:1.5px solid var(--field-border);border-radius:14px;padding:14px 18px;font-size:15px;outline:none;background:var(--field-bg);color:var(--field-fg)">
        </sc-if>
        <sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:8px;direction:ltr">
            <select value="{{ countryCode }}" onChange="{{ onCountryCode }}" style="width:130px;border:1.5px solid var(--field-border);border-radius:14px;padding:14px 8px;font-size:14px;outline:none;background:var(--field-bg);color:var(--field-fg);cursor:pointer">
              <sc-for list="{{ countryCodes }}" as="cc" hint-placeholder-count="10"><option value="{{ cc.code }}">{{ cc.label }}</option></sc-for>
            </select>
            <input ref="{{ phoneRef }}" type="tel" placeholder="{{ t.fPhone }}" style="flex:1;min-width:0;text-align:start;border:1.5px solid var(--field-border);border-radius:14px;padding:14px 18px;font-size:15px;outline:none;background:var(--field-bg);color:var(--field-fg)">
          </div>
        </sc-if>
        <sc-if value="{{ formError }}" hint-placeholder-val="{{ false }}"><div style="color:#e0245e;font-size:13px;font-weight:700">{{ formError }}</div></sc-if>
        <button type="submit" style="margin-top:6px;background:linear-gradient(135deg,#f68743,#d1662a);border:none;border-radius:16px;padding:15px;font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;color:#121212;cursor:pointer;box-shadow:0 10px 26px rgba(246,135,67,.3)">{{ t.findAccount }}</button>
      </form>
    </sc-if>

    <sc-if value="{{ isOtp }}" hint-placeholder-val="{{ false }}">
      <form onSubmit="{{ submitOtp }}" ref="{{ formRef }}" style="display:flex;flex-direction:column;gap:20px;align-items:center">
        <div style="display:flex;gap:9px;direction:ltr">
          <sc-for list="{{ otpBoxes }}" as="ob" hint-placeholder-count="6">
            <input class="otp-box" ref="{{ ob.ref }}" value="{{ ob.val }}" onChange="{{ ob.onChange }}" onKeyDown="{{ ob.onKeyDown }}" maxlength="1" inputmode="numeric">
          </sc-for>
        </div>
        <sc-if value="{{ formError }}" hint-placeholder-val="{{ false }}"><div style="color:#e0245e;font-size:13px;font-weight:700">{{ formError }}</div></sc-if>
        <button type="submit" style="width:100%;background:linear-gradient(135deg,#f68743,#d1662a);border:none;border-radius:16px;padding:15px;font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;color:#121212;cursor:pointer;box-shadow:0 10px 26px rgba(246,135,67,.3)">{{ t.verify }}</button>
        <div style="font-size:13.5px;color:var(--body-dim)">
          <sc-if value="{{ canResend }}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{ resendOtp }}" style="border:none;background:none;color:#f68743;font-family:'Cairo',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;padding:0">{{ t.resend }}</button>
          </sc-if>
          <sc-if value="{{ cannotResend }}" hint-placeholder-val="{{ true }}">{{ t.resendIn }} {{ resendSeconds }}s</sc-if>
        </div>
      </form>
    </sc-if>

    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:10px;background:rgba(246,135,67,.14);border:1px solid rgba(246,135,67,.4);border-radius:14px;padding:12px 16px;color:var(--accent-ink);font-size:14px;font-weight:600;margin-top:16px;animation:fadeUp .5s ease both">
        <span style="width:22px;height:22px;min-width:22px;border-radius:50%;background:#f68743;color:#121212;display:grid;place-items:center;font-size:13px;font-weight:900">✓</span>
        {{ sentMsg }}
      </div>
    </sc-if>

    <sc-if value="{{ isAuth }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:14px;margin:24px 0 18px;color:var(--body-dim);font-size:12.5px;font-weight:600">
        <div style="flex:1;height:1px;background:var(--hairline)"></div>
        {{ t.or }}
        <div style="flex:1;height:1px;background:var(--hairline)"></div>
      </div>
      <div style="display:flex;gap:12px">
        <button onClick="{{ noop }}" style="flex:1;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--glass-border);border-radius:14px;padding:12px;background:var(--glass-bg);backdrop-filter:blur(8px);color:var(--nav-text);font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all .4s cubic-bezier(.25,.8,.35,1)" style-hover="background:var(--hairline);transform:translateY(-2px)">
          <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.2H12v4.1h6.5c-.1 1.1-.8 2.7-2.4 3.8l3.7 2.9c2.2-2.1 3.7-5.1 3.7-8.6z"></path><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.7-2.9c-1 .7-2.4 1.2-4.2 1.2-3.1 0-5.8-2.1-6.7-5l-3.9 3C3.4 21.3 7.4 24 12 24z"></path><path fill="#FBBC05" d="M5.3 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-3.9-3C.5 8.2 0 10 0 12s.5 3.8 1.4 5.4l3.9-3z"></path><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.6l3.9 3c.9-2.9 3.6-4.9 6.7-4.9z"></path></svg>
          Google
        </button>
        <button onClick="{{ noop }}" style="flex:1;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--glass-border);border-radius:14px;padding:12px;background:var(--glass-bg);backdrop-filter:blur(8px);color:var(--nav-text);font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all .4s cubic-bezier(.25,.8,.35,1)" style-hover="background:var(--hairline);transform:translateY(-2px)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4h-3v-3.5h3V9.4c0-3 1.8-4.7 4.6-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"></path></svg>
          Facebook
        </button>
      </div>
    </sc-if>
  </div>
</main>

<div style="margin-top:auto"><dc-import name="SiteFooter" dir="{{ dir }}" hint-size="100%,300px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;defaultLang&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;ar&quot;, &quot;en&quot;], &quot;default&quot;: &quot;ar&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = {
    lang: null, mode: 'login', method: 'email', countryCode: '+970',
    showPass: false, remember: false, sent: false, formError: '',
    otp: ['', '', '', '', '', ''], resendSeconds: 45, otpFor: null,
  };
  formRef = React.createRef();
  nameRef = React.createRef(); emailRef = React.createRef(); phoneRef = React.createRef(); passRef = React.createRef();
  otpRefs = [0, 1, 2, 3, 4, 5].map(() => React.createRef());
  componentDidMount() {
    try { const tv = localStorage.getItem('palmas_theme'); const th = (tv === 'light' || tv === 'dark') ? tv : 'light'; document.documentElement.setAttribute('data-theme', th); } catch(e) {}
    try { const lv = localStorage.getItem('palmas_lang'); if (lv === 'ar' || lv === 'en') { this.setState({ lang: lv }); document.documentElement.lang = lv; document.documentElement.dir = lv === 'en' ? 'ltr' : 'rtl'; } } catch(e) {}
    try {
      const u = new URLSearchParams(location.search);
      const mv = u.get('mode'); if (mv === 'signup' || mv === 'login') this.setState({ mode: mv });
      this._next = u.get('next') || null;
    } catch(e) {}
  }
  componentWillUnmount() { if (this._timer) clearInterval(this._timer); }
  countryList() {
    return [
      { code: '+970', ar: 'فلسطين', en: 'Palestine' }, { code: '+962', ar: 'الأردن', en: 'Jordan' },
      { code: '+971', ar: 'الإمارات', en: 'UAE' }, { code: '+966', ar: 'السعودية', en: 'Saudi Arabia' },
      { code: '+965', ar: 'الكويت', en: 'Kuwait' }, { code: '+974', ar: 'قطر', en: 'Qatar' },
      { code: '+973', ar: 'البحرين', en: 'Bahrain' }, { code: '+968', ar: 'عُمان', en: 'Oman' },
      { code: '+20', ar: 'مصر', en: 'Egypt' }, { code: '+961', ar: 'لبنان', en: 'Lebanon' },
    ];
  }
  data() {
    return {
      ar: {
        loginTab: 'تسجيل الدخول', signupTab: 'حساب جديد', back: 'رجوع',
        loginTitle: 'أهلاً بعودتك', loginSub: 'سجّل دخولك لتتابع عقاراتك وقائمة رغباتك.',
        signupTitle: 'انضم إلى بالماس', signupSub: 'أنشئ حسابك واحفظ عقاراتك المفضلة وتابع الجديد أولاً بأول.',
        forgotTitle: 'استعادة كلمة المرور', forgotSub: 'اختر طريقة الاستعادة وأدخل بياناتك للبحث عن حسابك.',
        otpTitle: 'أدخل رمز التحقق', otpSub: 'أرسلنا رمزاً مكوّناً من 6 أرقام إلى',
        byEmail: 'البريد الإلكتروني', byPhone: 'رقم الهاتف',
        fName: 'الاسم الكامل', fEmail: 'البريد الإلكتروني', fPhone: 'رقم الهاتف', fPass: 'كلمة المرور', showPass: 'إظهار كلمة المرور',
        remember: 'تذكرني', forgot: 'نسيت كلمة المرور؟', or: 'أو تابع عبر',
        loginCta: 'دخول', signupCta: 'إنشاء الحساب', findAccount: 'بحث عن الحساب', verify: 'تأكيد الرمز',
        resend: 'إعادة إرسال الرمز', resendIn: 'إعادة الإرسال بعد',
        loginSent: 'تم تسجيل دخولك بنجاح — أهلاً بك!', signupSent: 'تم إنشاء حسابك بنجاح — أهلاً بك في بالماس!',
        errRequired: 'الرجاء إدخال البيانات المطلوبة.', errNotFound: 'لا يوجد حساب بهذه البيانات.',
        errOtp: 'الرمز غير صحيح.', errPassShort: 'كلمة المرور قصيرة جداً.',
        errLoading: 'لحظة — جاري الاتصال بالسيرفر، جرّب كمان مرة.',
      },
      en: {
        loginTab: 'Sign in', signupTab: 'Sign up', back: 'Back',
        loginTitle: 'Welcome back', loginSub: 'Sign in to follow your properties and wishlist.',
        signupTitle: 'Join Palmas', signupSub: 'Create your account, save favorites and get updates first.',
        forgotTitle: 'Reset password', forgotSub: 'Choose a recovery method and enter your details to find your account.',
        otpTitle: 'Enter verification code', otpSub: 'We sent a 6-digit code to',
        byEmail: 'Email', byPhone: 'Phone number',
        fName: 'Full name', fEmail: 'Email address', fPhone: 'Phone number', fPass: 'Password', showPass: 'Show password',
        remember: 'Remember me', forgot: 'Forgot password?', or: 'or continue with',
        loginCta: 'Sign in', signupCta: 'Create account', findAccount: 'Find account', verify: 'Verify code',
        resend: 'Resend code', resendIn: 'Resend in',
        loginSent: 'Signed in successfully — welcome!', signupSent: 'Account created — welcome to Palmas!',
        errRequired: 'Please fill in the required fields.', errNotFound: 'No account found with these details.',
        errOtp: 'Incorrect code.', errPassShort: 'Password is too short.',
        errLoading: 'One moment — still connecting to the server, please try again.',
      },
    };
  }
  _go(mode, extra) { this.setState({ mode, sent: false, showPass: false, formError: '', ...(extra || {}) }); }
  _startTimer() {
    if (this._timer) clearInterval(this._timer);
    this.setState({ resendSeconds: 45 });
    this._timer = setInterval(() => {
      this.setState(s => {
        if (s.resendSeconds <= 1) { clearInterval(this._timer); return { resendSeconds: 0 }; }
        return { resendSeconds: s.resendSeconds - 1 };
      });
    }, 1000);
  }
  _identifier() {
    if (this.state.method === 'phone') return (this.phoneRef.current?.value || '').trim() ? this.state.countryCode + (this.phoneRef.current?.value || '').trim() : '';
    return (this.emailRef.current?.value || '').trim().toLowerCase();
  }
  _shake() { const f = this.formRef.current; if (f) { f.style.animation = 'shake .45s ease'; setTimeout(() => { f.style.animation = ''; }, 500); } }
  renderVals() {
    const lang = this.state.lang || this.props.defaultLang || 'ar';
    const t = this.data()[lang];
    const m = this.state.mode;
    const isLogin = m === 'login', isSignup = m === 'signup', isForgotMethod = m === 'forgotMethod', isOtp = m === 'otp';
    const isCred = isLogin || isSignup;
    const heading = isLogin ? t.loginTitle : isSignup ? t.signupTitle : isForgotMethod ? t.forgotTitle : t.otpTitle;
    const subheading = isLogin ? t.loginSub : isSignup ? t.signupSub : isForgotMethod ? t.forgotSub : (t.otpSub + ' ' + (this.state.otpFor || ''));
    const ctaLabel = isLogin ? t.loginCta : t.signupCta;
    const sentMsg = isLogin ? t.loginSent : t.signupSent;
    const countryCodes = this.countryList().map(c => ({ code: c.code, label: c.code + ' ' + (lang === 'ar' ? c.ar : c.en) }));
    const otpBoxes = this.state.otp.map((v, i) => ({
      val: v, ref: this.otpRefs[i],
      onChange: (e) => {
        const val = (e.target.value || '').replace(/\D/g, '').slice(-1);
        this.setState(s => { const arr = s.otp.slice(); arr[i] = val; return { otp: arr, formError: '' }; });
        if (val && this.otpRefs[i + 1]) this.otpRefs[i + 1].current?.focus();
      },
      onKeyDown: (e) => { if (e.key === 'Backspace' && !this.state.otp[i] && this.otpRefs[i - 1]) this.otpRefs[i - 1].current?.focus(); },
    }));
    return {
      t, dir: lang === 'ar' ? 'rtl' : 'ltr', mode: m,
      isLogin, isSignup, isForgotMethod, isOtp, isCred,
      isAuth: isCred, showBackArrow: isForgotMethod || isOtp,
      backArrowFlip: lang === 'ar' ? 'scaleX(-1)' : 'none',
      heading, subheading, ctaLabel, sentMsg, sent: this.state.sent, formError: this.state.formError,
      loginTabBg: isLogin ? '#f68743' : 'transparent', loginTabColor: isLogin ? '#121212' : 'var(--nav-text)',
      signupTabBg: isSignup ? '#f68743' : 'transparent', signupTabColor: isSignup ? '#121212' : 'var(--nav-text)',
      isEmail: this.state.method === 'email', isPhone: this.state.method === 'phone',
      methodEmailBg: this.state.method === 'email' ? '#f68743' : 'transparent', methodEmailColor: this.state.method === 'email' ? '#121212' : 'var(--nav-text)',
      methodPhoneBg: this.state.method === 'phone' ? '#f68743' : 'transparent', methodPhoneColor: this.state.method === 'phone' ? '#121212' : 'var(--nav-text)',
      setMethodEmail: () => this.setState({ method: 'email', formError: '' }), setMethodPhone: () => this.setState({ method: 'phone', formError: '' }),
      countryCode: this.state.countryCode, countryCodes, onCountryCode: e => this.setState({ countryCode: e.target.value }),
      passType: this.state.showPass ? 'text' : 'password',
      rememberBg: this.state.remember ? '#f68743' : 'transparent',
      rememberBorder: this.state.remember ? '#f68743' : 'var(--field-border)',
      rememberMark: this.state.remember ? '✓' : '',
      formRef: this.formRef, nameRef: this.nameRef, emailRef: this.emailRef, phoneRef: this.phoneRef, passRef: this.passRef,
      otpBoxes, otpTarget: this.state.otpFor, canResend: this.state.resendSeconds <= 0, cannotResend: this.state.resendSeconds > 0, resendSeconds: this.state.resendSeconds,
      togglePass: () => this.setState(s => ({ showPass: !s.showPass })),
      toggleRemember: () => this.setState(s => ({ remember: !s.remember })),
      goLogin: () => this._go('login'), goSignup: () => this._go('signup'),
      goForgot: () => this._go('forgotMethod'),
      goBack: () => { if (isOtp) this._go('forgotMethod'); else this._go('login'); },
      noop: () => {},
      resendOtp: () => { window.Palmas.API.requestOtp({ identifier: this.state.otpFor, method: this.state.method }).catch(() => {}); this._startTimer(); this.setState({ sent: false }); },
      submit: (e) => {
        e.preventDefault();
        const id = this._identifier();
        if (!id) { this._shake(); this.setState({ formError: t.errRequired }); return; }
        const pass = this.passRef.current?.value || '';
        const name = (this.nameRef.current?.value || '').trim();
        if (pass.length < 4) { this._shake(); this.setState({ formError: t.errPassShort }); return; }
        if (isSignup && !name) { this._shake(); this.setState({ formError: t.errRequired }); return; }
        const P = window.Palmas;
        /* النواة قد لا تكون جاهزة في أول لحظات الصفحة — لا ننهار */
        if (!P) { this._shake(); this.setState({ formError: t.errLoading }); return; }
        const payload = { identifier: id, password: pass, method: this.state.method, name: name, remember: this.state.remember };
        const call = isSignup ? P.API.signUp(payload) : P.API.signIn(payload);
        this.setState({ formError: '' });
        call.then(sess => {
          this.setState({ sent: true });
          let ret = this._next; try { if (!ret) { ret = localStorage.getItem('palmas_return'); if (ret) localStorage.removeItem('palmas_return'); } } catch (e2) {}
          const dest = (sess.role === 'admin') ? 'Admin.dc.html' : (ret || 'Palmas Home.dc.html');
          setTimeout(() => { location.href = dest; }, 900);
        }).catch(() => { this._shake(); this.setState({ formError: t.errNotFound }); });
      },
      submitForgotMethod: (e) => {
        e.preventDefault();
        const id = this._identifier();
        if (!id) { this._shake(); this.setState({ formError: t.errRequired }); return; }
        const P = window.Palmas;
        /* النواة قد لا تكون جاهزة في أول لحظات الصفحة — لا ننهار */
        if (!P) { this._shake(); this.setState({ formError: t.errLoading }); return; }
        this.setState({ formError: '' });
        P.API.findAccount({ identifier: id, method: this.state.method })
          .then(() => P.API.requestOtp({ identifier: id, method: this.state.method }))
          .then(() => {
            this.setState({ otp: ['', '', '', '', '', ''] });
            this._go('otp', { otpFor: id });
            this._startTimer();
            setTimeout(() => this.otpRefs[0].current?.focus(), 50);
          })
          .catch(() => { this._shake(); this.setState({ formError: t.errNotFound }); });
      },
      /* the code IS the proof of identity for password recovery — once it verifies, sign the
         visitor straight in and hand them off to the account settings page, where they set the
         new password using the exact same field used for a normal password change. */
      submitOtp: (e) => {
        e.preventDefault();
        const code = this.state.otp.join('');
        if (code.length < 6) { this._shake(); this.setState({ formError: t.errOtp }); return; }
        const P = window.Palmas;
        /* النواة قد لا تكون جاهزة في أول لحظات الصفحة — لا ننهار */
        if (!P) { this._shake(); this.setState({ formError: t.errLoading }); return; }
        P.API.verifyOtp({ identifier: this.state.otpFor, code: code })
          .then(r => {
            if (!r || !r.ok) { this._shake(); this.setState({ formError: t.errOtp }); return; }
            return P.API.signInAfterOtp(this.state.otpFor).then(() => {
              try { localStorage.setItem('palmas_pw_recovery', '1'); } catch (e2) {}
              location.href = 'Account.dc.html';
            });
          })
          .catch(() => { this._shake(); this.setState({ formError: t.errOtp }); });
      },
    };
  }
}

</script>
