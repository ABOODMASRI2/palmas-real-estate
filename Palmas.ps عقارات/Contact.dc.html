<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="uploads/palmas-icon.png">
<title>Palmas.ps</title>
<script src="./support.js"></script>
<style>@view-transition{navigation:auto}::view-transition-old(root),::view-transition-new(root){animation-duration:.34s;animation-timing-function:cubic-bezier(.4,0,.2,1)}</style>
<script>try{var t=localStorage.getItem('palmas_theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'light');var l=localStorage.getItem('palmas_lang');document.documentElement.lang=(l==='en')?'en':'ar';document.documentElement.dir=(l==='en')?'ltr':'rtl';}catch(e){}</script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
:root{--page-bg:#edeef0;--heading:#141414;--body:#4b4b4d;--body-dim:rgba(20,20,22,.5);--panel:#ffffff;--panel-2:#e7e9ec;--panel-border:rgba(20,20,22,.1);--nav-text:#2a2a2c;--header-bg:rgba(237,238,240,.85);--hairline:rgba(20,20,22,.1);--chip-bg:rgba(20,20,22,.045);--input-bg:#ffffff;--input-border:rgba(20,20,22,.16);--card:#ffffff;--card-fg:#181818;--card-sub:#6c6c70;--card-line:#e4e5e8;--card-stat:#eceef1;--accent-ink:#b53a0f;--footer-base:#101013}
html[data-theme='dark']{--page-bg:#0d0d0f;--heading:#f7f7f5;--body:#d4d4d6;--body-dim:rgba(247,247,245,.55);--panel:rgba(255,255,255,.055);--panel-2:rgba(255,255,255,.03);--panel-border:rgba(255,255,255,.12);--nav-text:#ededeb;--header-bg:rgba(13,13,15,.72);--hairline:rgba(255,255,255,.1);--chip-bg:rgba(255,255,255,.05);--input-bg:rgba(0,0,0,.3);--input-border:rgba(255,255,255,.16);--card:#ffffff;--card-fg:#181818;--card-sub:#6c6c70;--card-line:#e4e5e8;--card-stat:#f4f4f6;--accent-ink:#ffcdb0;--footer-base:#000000}
html,body{margin:0;padding:0;background:var(--page-bg);transition:background .5s ease}
*{box-sizing:border-box}
.megapanel{opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .3s}
header:has(.megalink:hover) .megapanel,.megapanel:hover{opacity:1;visibility:visible;transition:opacity .25s ease,visibility 0s}
a{color:#f68743;text-decoration:none}
a:hover{color:#ffab7a}
::selection{background:#f68743;color:#121212}
input,textarea{font-family:'Cairo',sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
</style>
<script src="image-slot.js"></script>
<script src="palmas-photos.js"></script>
</helmet>
<div dir="{{ dir }}" style="position:relative;font-family:'Cairo',sans-serif;background:var(--page-bg);color:var(--body);min-height:100vh;display:flex;flex-direction:column;transition:background .5s ease,color .5s ease">


<dc-import name="SiteHeader" dir="{{ dir }}" hint-size="100%,68px"></dc-import>

<section style="position:relative;z-index:1;padding:120px 52px 60px;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% -10%,rgba(246,135,67,.18),transparent 60%)">
  <div style="max-width:820px;margin:0 auto;animation:fadeUp .9s ease both">
    <div style="color:#f68743;font-weight:800;font-size:15px;letter-spacing:2px;margin-bottom:12px">{{ t.kicker }}</div>
    <h1 style="margin:0;font-size:52px;font-weight:800;color:var(--heading);line-height:1.3;text-wrap:balance">{{ t.title }}</h1>
    <p style="margin:20px auto 0;max-width:600px;font-size:18px;line-height:2;color:var(--body-dim)">{{ t.lead }}</p>
  </div>
</section>

<section style="position:relative;z-index:1;padding:20px 52px 90px">
  <div style="max-width:min(1440px,92vw);margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:52px;align-items:start">
    <div data-reveal="">
      <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:30px">
        <sc-for list="{{ contactRows }}" as="cr" hint-placeholder-count="4">
          <a href="{{ cr.href }}" style="display:flex;align-items:center;gap:14px;border-radius:14px;padding:10px;transition:background .4s ease,transform .45s cubic-bezier(.25,.8,.35,1)" style-hover="background:rgba(246,135,67,.08);transform:translateX(6px)">
            <div style="width:48px;height:48px;min-width:48px;border-radius:14px;background:rgba(246,135,67,.15);display:grid;place-items:center;color:#f68743;font-size:21px;font-weight:900">{{ cr.iconEl }}</div>
            <div style="line-height:1.5">
              <div style="color:var(--body-dim);font-size:12.5px">{{ cr.label }}</div>
              <div dir="ltr" style="color:var(--heading);font-weight:700;font-size:16px;text-align:start">{{ cr.value }}</div>
            </div>
          </a>
        </sc-for>
      </div>
      <a href="{{ waLink }}" target="_blank" style="display:inline-flex;align-items:center;gap:10px;background:#25D366;color:#07130a;font-weight:800;font-size:16px;padding:14px 30px;border-radius:28px;transition:background .4s ease,transform .5s cubic-bezier(.25,.8,.35,1),box-shadow .5s ease" style-hover="background:#4ce383;transform:translateY(-4px);box-shadow:0 14px 32px rgba(37,211,102,.4)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#07130a"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.1 14.1c-.2.6-1.2 1.1-1.7 1.2-.5 0-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.5.5c-.2.2-.3.4-.1.7.2.3.9 1.5 2 2.4 1.4 1.2 2.5 1.6 2.8 1.7.3.1.5.1.7-.1l1-1.2c.2-.3.4-.2.7-.1l2.1 1c.3.1.5.2.6.4 0 .1 0 .7-.2 1.3z"></path></svg>
        {{ t.waBtn }}
      </a>
      <div style="margin-top:34px;border-radius:18px;overflow:hidden;height:240px;border:1px solid var(--hairline)">
        <image-slot id="contact-map" shape="rect" placeholder="{{ t.mapPh }}"></image-slot>
      </div>
    </div>
    <div data-reveal="" style="background:#fff;color:#17221a;border-radius:22px;padding:34px;min-height:1px">
      <sc-if value="{{ formSent }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center;padding:14px 4px">
          <div style="width:72px;height:72px;margin:0 auto 18px;border-radius:50%;background:rgba(31,157,92,.14);display:grid;place-items:center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1f9d5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
          <div style="font-weight:800;font-size:21px;margin-bottom:10px">{{ t.sentTitle }}</div>
          <p style="margin:0 0 22px;font-size:14.5px;line-height:1.8;color:#5c665a">{{ t.sentSub }}</p>
          <button onClick="{{ resetForm }}" style="background:#f4f6f2;border:1.5px solid #e0e6da;border-radius:13px;padding:12px 30px;font-family:'Cairo',sans-serif;font-weight:800;font-size:14.5px;color:#17221a;cursor:pointer;transition:all .3s ease" style-hover="border-color:#f68743;color:#f68743">{{ t.sentDone }}</button>
        </div>
      </sc-if>
      <sc-if value="{{ formNotSent }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ sendWhats }}" style="display:flex;flex-direction:column;gap:16px">
          <div style="font-weight:800;font-size:22px">{{ t.formTitle }}</div>
          <input ref="{{ nameRef }}" placeholder="{{ t.formName }}" style="border:1.5px solid #e0e6da;border-radius:12px;padding:13px 16px;font-size:15px;outline:none;background:#fafbf8;transition:border-color .3s ease,box-shadow .3s ease" style-focus="border-color:#f68743;box-shadow:0 0 0 4px rgba(246,135,67,.15)">
          <input ref="{{ phoneRef }}" placeholder="{{ t.formPhone }}" style="border:1.5px solid #e0e6da;border-radius:12px;padding:13px 16px;font-size:15px;outline:none;background:#fafbf8;transition:border-color .3s ease,box-shadow .3s ease" style-focus="border-color:#f68743;box-shadow:0 0 0 4px rgba(246,135,67,.15)">
          <textarea ref="{{ msgRef }}" rows="5" placeholder="{{ t.formMsg }}" style="border:1.5px solid #e0e6da;border-radius:12px;padding:13px 16px;font-size:15px;outline:none;resize:vertical;background:#fafbf8;transition:border-color .3s ease,box-shadow .3s ease" style-focus="border-color:#f68743;box-shadow:0 0 0 4px rgba(246,135,67,.15)"></textarea>
          <sc-if value="{{ formErr }}" hint-placeholder-val="{{ false }}">
            <div style="color:#e0245e;font-size:13px;font-weight:700;margin-top:-6px">{{ t.formErrMsg }}</div>
          </sc-if>
          <button type="submit" style="background:#f68743;border:none;border-radius:14px;padding:15px;font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;color:#121212;cursor:pointer;transition:background .4s ease,transform .45s cubic-bezier(.25,.8,.35,1)" style-hover="background:#ffab7a;transform:translateY(-3px)">{{ t.formSend }}</button>
        </form>
      </sc-if>
    </div>
  </div>
</section>

<div style="margin-top:auto"><dc-import name="SiteFooter" dir="{{ dir }}" hint-size="100%,300px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;defaultLang&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;ar&quot;, &quot;en&quot;], &quot;default&quot;: &quot;ar&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;whatsappNumber&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;972595377421&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { lang: null, theme: null, formSent: false, formErr: false };
  nameRef = React.createRef();
  phoneRef = React.createRef();
  msgRef = React.createRef();
  bgVideoRef = React.createRef();
  componentDidMount() {
    try{const tv=localStorage.getItem('palmas_theme'); const th=(tv==='light'||tv==='dark')?tv:'light'; document.documentElement.setAttribute('data-theme',th); this.setState({theme:th});}catch(e){} try{const lv=localStorage.getItem('palmas_lang'); if(lv==='ar'||lv==='en'){this.setState({lang:lv}); document.documentElement.lang=lv; document.documentElement.dir=lv==='en'?'ltr':'rtl';}}catch(e){}
    /* a link from PropertyDetails/ProjectDetails ("?subject=...") prefills the message so the
       resulting CRM message lead keeps that context instead of arriving as a blank inquiry */
    try { const subj = new URLSearchParams(location.search).get('subject'); if (subj && this.msgRef.current) this.msgRef.current.value = subj + ' — '; } catch(e) {}
    setTimeout(() => this._setupReveal(), 150);
    let init = false;
    const tick = () => {
      const bg = this.bgVideoRef.current;
      if (bg && bg.readyState >= 2 && bg.duration && !isNaN(bg.duration)) {
        if (!init) { bg.muted = true; bg.pause(); init = true; }
        const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const frac = Math.min(1, Math.max(0, window.scrollY / max));
        const t = frac * bg.duration * 0.999;
        if (Math.abs(t - bg.currentTime) > 0.02 && !bg.seeking) bg.currentTime = t;
        if (!bg.paused) bg.pause();
      }
      if (++this._frame % 10 === 0) this._revealCheck();
      this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
  }
  _frame = 0;
  _revealCheck() {
    if (!this._pending || !this._pending.size) return;
    const vh = window.innerHeight;
    this._pending.forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.top < vh * 0.94 && r.bottom > 0) {
        el.style.opacity = '1'; el.style.transform = 'translateY(0)';
        el.addEventListener('transitionend', () => { el.style.transform = ''; el.style.transition = el._baseTransition || ''; }, { once: true });
        if (this._io) this._io.unobserve(el);
        this._pending.delete(el);
      }
    });
  }
  componentWillUnmount() {
    if (this._io) this._io.disconnect();
    if (this._raf) cancelAnimationFrame(this._raf);
  }
  _setupReveal() {
    const els = Array.from(document.querySelectorAll('[data-reveal]'));
    this._pending = new Set();
    const io = new IntersectionObserver((ents) => {
      ents.forEach((en) => {
        if (!en.isIntersecting) return;
        const el = en.target;
        el.style.opacity = '1'; el.style.transform = 'translateY(0)';
        el.addEventListener('transitionend', () => { el.style.transform = ''; el.style.transition = el._baseTransition || ''; }, { once: true });
        io.unobserve(el);
        if (this._pending) this._pending.delete(el);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    els.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const onscreen = r.top < window.innerHeight && r.bottom > 0;
      const d = (onscreen ? i : (i % 3)) * 0.09;
      el._baseTransition = el.style.transition || '';
      el.style.opacity = '0'; el.style.transform = 'translateY(32px)';
      el.style.transition = 'opacity .9s ease ' + d + 's, transform .9s cubic-bezier(.25,.8,.35,1) ' + d + 's';
      io.observe(el);
      this._pending.add(el);
    });
    this._io = io;
  }
  _icon(name, color, size) {
    const P = {
      buysell: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>',
      marketing: '<path d="m3 11 15-6v14L3 13z"/><path d="M2 11a1 1 0 0 0 0 3"/><path d="M7 13.5V19a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-4"/>',
      mgmt: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.8 12.2 8.2-8.2"/><path d="m15.5 5.5 2.5 2.5"/><path d="m19 3 2 2"/>',
      consult: '<path d="M3 3v18h18"/><path d="m7 13 3-3 3 2 5-6"/>',
      legal: '<path d="M12 3v18"/><path d="M7 21h10"/><path d="M4.5 7 12 5l7.5 2"/><path d="M4.5 7 2 13h5z"/><path d="M19.5 7 17 13h5z"/>',
      finance: '<path d="M3 8a2 2 0 0 1 2-2h12v3"/><path d="M3 8v9a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-3"/><path d="M17 11h4v4h-4a2 2 0 0 1 0-4z"/>',
      phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
      mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/>',
      pin: '<path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
      award: '<circle cx="12" cy="9" r="6"/><path d="M8.5 13.5 7 21l5-2.5L17 21l-1.5-7.5"/>',
      heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>',
    };
    return React.createElement('svg', { width: size || 26, height: size || 26, viewBox: '0 0 24 24', fill: 'none', stroke: color || '#f68743', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', dangerouslySetInnerHTML: { __html: P[name] || '' } });
  }
  data() {
    return {
      ar: {
        t: { tagline: 'عقارك .. مستقبلك', langBtn: 'EN', kicker: 'تواصل معنا',
          title: 'جاهزون لمساعدتك', lead: 'راسلنا أو اتصل بنا وسيرد عليك أحد مستشارينا خلال ساعات العمل.',
          waBtn: 'تواصل عبر واتساب', mapPh: 'خريطة الموقع', formTitle: 'أرسل استفسارك',
          formName: 'الاسم الكامل', formPhone: 'رقم الهاتف', formMsg: 'كيف نساعدك؟', formSend: 'إرسال عبر واتساب',
          formErrMsg: 'الرجاء إدخال الاسم ورقم الهاتف.',
          sentTitle: 'تم استلام رسالتك!', sentSub: 'شكراً لتواصلك معنا — سيرد عليك أحد مستشارينا قريباً. فتحنا لك واتساب أيضاً لمتابعة استفسارك مباشرة.', sentDone: 'إرسال رسالة أخرى',
          rights: '© 2026 Palmas.ps — جميع الحقوق محفوظة', credit: 'صُمم وطُوّر بواسطة فريق Palmas.ps' },
        navLinks: [
          { label: 'الرئيسية', href: 'Palmas Home.dc.html' }, { label: 'العقارات', href: 'PropertyList.dc.html', cls: 'megalink', mega: { title: 'العقارات في فلسطين', arrow: '←', img: 'uploads/pexels-house-1836070.jpg', imgLabel: 'عقارات بالماس', types: [{ label: 'أراضٍ', href: 'PropertyList.dc.html?type=land' }, { label: 'عقارات للبيع', href: 'PropertyList.dc.html?cat=sale' }, { label: 'عقارات للإيجار', href: 'PropertyList.dc.html?cat=rent' }, { label: 'سكنات', href: 'PropertyList.dc.html?cat=residential' }] } },
          { label: 'المشاريع', href: 'Projects.dc.html' }, { label: 'خدماتنا', href: 'Services.dc.html' },
          { label: 'من نحن', href: 'About.dc.html' }, { label: 'تواصل معنا', href: 'Contact.dc.html' },
        ],
        contactRows: [
          { icon: 'phone', label: 'الهاتف / واتساب', value: '+972 59 537 7421', href: 'tel:+972595377421' },
          { icon: 'mail', label: 'البريد الإلكتروني', value: 'info@palmas.ps', href: 'mailto:info@palmas.ps' },

      },
    };
  }
  renderVals() {
    const lang = this.state.lang || this.props.defaultLang || 'ar';
    const d = this.data()[lang];
    const wa = String(this.props.whatsappNumber ?? '972595377421').replace(/[^0-9]/g, '');
    const nav = d.navLinks.map(l => ({ ...l, color: l.href === 'Contact.dc.html' ? '#121212' : 'var(--nav-text)', bg: l.href === 'Contact.dc.html' ? '#f68743' : 'transparent' }));
    const contactRows = d.contactRows.map(cr => ({ ...cr, iconEl: this._icon(cr.icon, '#f68743', 22) }));
    return { ...d, contactRows, navLinks: nav, dir: lang === 'ar' ? 'rtl' : 'ltr',
      bgVideoRef: this.bgVideoRef,

        this.setState({ formSent: false, formErr: false });
      },
      isDark:(this.state.theme||'light')==='dark', isLight:(this.state.theme||'light')==='light', themeTitle: lang==='ar'?((this.state.theme||'light')==='dark'?'الوضع الفاتح':'الوضع الداكن'):((this.state.theme||'light')==='dark'?'Light mode':'Dark mode'), toggleTheme: () => { const nt=(this.state.theme||'light')==='dark'?'light':'dark'; try{localStorage.setItem('palmas_theme',nt);}catch(e){} document.documentElement.setAttribute('data-theme',nt); this.setState({theme:nt}); }, toggleLang: () => this.setState({ lang: lang === 'ar' ? 'en' : 'ar' }),
      sendWhats: (e) => {
        e.preventDefault();
        const name = (this.nameRef.current?.value || '').trim();
        const phone = (this.phoneRef.current?.value || '').trim();
        const msg = (this.msgRef.current?.value || '').trim();
        if (!name || !phone) { this.setState({ formErr: true }); return; }
        try {
          const all = JSON.parse(localStorage.getItem('palmas_crm_messages') || '[]');
          all.push({ id: 'm' + Date.now(), name, phone, msg, lang, ts: Date.now() });
          localStorage.setItem('palmas_crm_messages', JSON.stringify(all));
        } catch (err) {}
        const text = (lang === 'ar' ? 'مرحباً، أنا ' : 'Hello, I am ') + name + (phone ? ' (' + phone + ')' : '') + (msg ? ' — ' + msg : '');
        window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(text), '_blank');
        [this.nameRef, this.phoneRef, this.msgRef].forEach(r => { if (r.current) r.current.value = ''; });
        this.setState({ formSent: true, formErr: false });
      },
    };
  }
}
</script>
