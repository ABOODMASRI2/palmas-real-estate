<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="uploads/palmas-icon.png">
<title>Palmas.ps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth}
*{box-sizing:border-box}
:root{--page-bg:#edeef0;--heading:#141414;--body:#4b4b4d;--body-dim:rgba(20,20,22,.5);--panel:#ffffff;--panel-2:#e7e9ec;--panel-border:rgba(20,20,22,.1);--hairline:rgba(20,20,22,.08);--label-bg:#f4f5f7;--best-bg:rgba(31,157,92,.11);--best-fg:#157a47}
html[data-theme='dark']{--page-bg:#0d0d0f;--heading:#f7f7f5;--body:#d4d4d6;--body-dim:rgba(247,247,245,.55);--panel:#17171b;--panel-2:rgba(255,255,255,.03);--panel-border:rgba(255,255,255,.12);--hairline:rgba(255,255,255,.08);--label-bg:#1d1d22;--best-bg:rgba(63,207,142,.14);--best-fg:#5fdba0}
html,body{margin:0;padding:0;background:var(--page-bg);transition:background .5s ease}
a{color:#f68743;text-decoration:none}
a:hover{color:#ffab7a}
::selection{background:#f68743;color:#fff}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.cmp-scroll{overflow-x:auto;border-radius:22px;border:1px solid var(--panel-border);background:var(--panel);box-shadow:0 14px 40px rgba(20,20,30,.07)}
.cmp-grid{display:grid;min-width:max-content}
.cmp-lbl{position:sticky;inset-inline-start:0;z-index:2;background:var(--label-bg);padding:14px 18px;font-weight:800;font-size:13.5px;color:var(--body-dim);border-top:1px solid var(--hairline);display:flex;align-items:center}
.cmp-cell{padding:14px 18px;font-weight:700;font-size:14.5px;color:var(--heading);border-top:1px solid var(--hairline);border-inline-start:1px solid var(--hairline);display:flex;align-items:center;gap:8px}
.cmp-sec{grid-column:1 / -1;padding:12px 18px;background:var(--panel-2);border-top:1px solid var(--hairline);font-weight:900;font-size:13px;color:#f68743;letter-spacing:.5px}
.cmp-pad{padding-left:52px;padding-right:52px}
@media (max-width:900px){.cmp-pad{padding-left:16px!important;padding-right:16px!important}}
</style>
<script src="image-slot.js"></script>
<script src="palmas-photos.js"></script>
<script src="palmas-core.js"></script>
<script src="palmas-config.js"></script>
<script src="palmas-backend.js"></script>
</helmet>

<div dir="{{ dir }}" style="position:relative;font-family:'Cairo',sans-serif;background:var(--page-bg);color:var(--body);min-height:100vh;display:flex;flex-direction:column;transition:background .5s ease,color .5s ease">

<dc-import name="SiteHeader" dir="{{ dir }}" hint-size="100%,68px"></dc-import>

<section class="cmp-pad" style="padding-top:48px;padding-bottom:20px">
  <div style="max-width:min(1680px,94vw);margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;animation:fadeUp .6s ease both">
    <div>
      <div style="color:#f68743;font-weight:800;font-size:14px;letter-spacing:1.5px;margin-bottom:8px">{{ t.kicker }}</div>
      <h1 style="margin:0;font-size:clamp(28px,3vw,40px);font-weight:900;color:var(--heading)">{{ t.title }}</h1>
      <div style="margin-top:6px;color:var(--body-dim);font-size:15px;font-weight:600">{{ subtitle }}</div>
    </div>
    <sc-if value="{{ hasAny }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <label style="display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--body);cursor:pointer;background:var(--panel);border:1px solid var(--panel-border);padding:9px 14px;border-radius:14px">
          <input type="checkbox" checked="{{ diffOnly }}" onChange="{{ toggleDiff }}" style="width:16px;height:16px;accent-color:#f68743">{{ t.diffOnly }}
        </label>
        <sc-if value="{{ canAdd }}" hint-placeholder-val="{{ true }}">
          <a href="PropertyList.dc.html" style="display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--panel-border);color:var(--heading);font-weight:800;font-size:13.5px;padding:9px 16px;border-radius:14px" style-hover="border-color:#f68743;color:#f68743">+ {{ t.addMore }}</a>
        </sc-if>
        <button type="button" onClick="{{ share }}" style="display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--panel-border);color:var(--heading);font-family:'Cairo',sans-serif;font-weight:800;font-size:13.5px;padding:9px 16px;border-radius:14px;cursor:pointer" style-hover="border-color:#f68743;color:#f68743">{{ shareLabel }}</button>
        <a href="{{ waHref }}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:7px;background:#25d366;color:#fff;font-weight:800;font-size:13.5px;padding:9px 16px;border-radius:14px" style-hover="color:#fff;filter:brightness(1.06)">{{ t.ask }}</a>
        <button type="button" onClick="{{ clearAll }}" style="background:transparent;border:none;color:#e0245e;font-family:'Cairo',sans-serif;font-weight:800;font-size:13.5px;cursor:pointer;padding:9px 6px">{{ t.clear }}</button>
      </div>
    </sc-if>
  </div>
</section>

<section class="cmp-pad" style="padding-bottom:90px;flex:1">
  <div style="max-width:min(1680px,94vw);margin:0 auto">

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="max-width:560px;margin:30px auto 0;text-align:center;background:var(--panel);border:1px solid var(--panel-border);border-radius:24px;padding:50px 34px;animation:fadeUp .6s ease both">
        <div style="width:78px;height:78px;margin:0 auto 18px;border-radius:50%;background:rgba(246,135,67,.14);display:grid;place-items:center">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f68743" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4" width="7" height="16" rx="1.5"></rect><rect x="14" y="4" width="7" height="16" rx="1.5"></rect><path d="M6.5 9h0M17.5 9h0M6.5 13h0M17.5 13h0"></path></svg>
        </div>
        <div style="font-weight:900;font-size:21px;color:var(--heading);margin-bottom:10px">{{ t.emptyTitle }}</div>
        <p style="margin:0 0 22px;color:var(--body-dim);font-size:15px;line-height:1.9">{{ t.emptyDesc }}</p>
        <a href="PropertyList.dc.html" style="display:inline-block;background:#f68743;color:#fff;font-weight:800;font-size:15px;padding:13px 32px;border-radius:14px" style-hover="background:#ffab7a;color:#fff">{{ t.browse }}</a>
      </div>
    </sc-if>

    <sc-if value="{{ needMore }}" hint-placeholder-val="{{ false }}">
      <div style="margin-bottom:16px;background:rgba(246,135,67,.1);border:1px solid rgba(246,135,67,.35);color:#b53a0f;font-weight:700;font-size:14px;padding:12px 18px;border-radius:14px">{{ t.needMore }}</div>
    </sc-if>

    <sc-if value="{{ hasAny }}" hint-placeholder-val="{{ true }}">
      <div class="cmp-scroll" style="animation:fadeUp .6s ease both">
        <div class="cmp-grid" style="grid-template-columns:{{ cols }}">
          <div class="cmp-lbl" style="border-top:none;align-items:flex-end;padding-bottom:18px">{{ t.legend }}</div>
          <sc-for list="{{ heads }}" as="h" hint-placeholder-count="3">
            <div style="padding:16px;border-inline-start:1px solid var(--hairline);display:flex;flex-direction:column;gap:10px">
              <div style="position:relative;height:150px;border-radius:14px;overflow:hidden;background:var(--panel-2)">
                <image-slot id="{{ h.slot }}" shape="rect" placeholder="{{ h.name }}"></image-slot>
                <button type="button" onClick="{{ h.remove }}" title="{{ t.remove }}" aria-label="{{ t.remove }}" style="position:absolute;top:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.94);color:#e0245e;font-size:17px;font-weight:900;cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.18);z-index:3">×</button>
                <span style="position:absolute;top:8px;inset-inline-start:8px;background:#f68743;color:#fff;font-weight:800;font-size:11.5px;padding:3px 10px;border-radius:11px;z-index:3">{{ h.offer }}</span>
              </div>
              <a href="{{ h.href }}" style="font-weight:900;font-size:16px;color:var(--heading);line-height:1.35" style-hover="color:#f68743">{{ h.name }}</a>
              <div style="color:var(--body-dim);font-size:12.5px;font-weight:600">{{ h.loc }}</div>
              <div style="color:#f68743;font-weight:900;font-size:18px">{{ h.price }}</div>
            </div>
          </sc-for>

          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
            <sc-if value="{{ r.isSection }}" hint-placeholder-val="{{ false }}">
              <div class="cmp-sec">{{ r.label }}</div>
            </sc-if>
            <sc-if value="{{ r.isRow }}" hint-placeholder-val="{{ true }}">
              <div class="cmp-lbl">{{ r.label }}</div>
              <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="3">
                <div class="cmp-cell" style="background:{{ c.bg }};color:{{ c.fg }}">{{ c.value }}<sc-if value="{{ c.best }}" hint-placeholder-val="{{ false }}"><span style="font-size:10.5px;font-weight:900;background:var(--best-fg);color:#fff;padding:2px 8px;border-radius:9px">{{ t.bestTag }}</span></sc-if></div>
              </sc-for>
            </sc-if>
          </sc-for>
        </div>
      </div>
      <div style="margin-top:12px;color:var(--body-dim);font-size:12.5px;font-weight:600;line-height:1.8">{{ t.note }}</div>
    </sc-if>
  </div>
</section>

<div style="margin-top:auto"><dc-import name="SiteFooter" dir="{{ dir }}" hint-size="100%,300px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 900}}">
class Component extends DCLogic {
  state = { lang: 'ar', ids: [], diffOnly: false, shared: false, tick: 0 };

  componentDidMount() {
    let lang = 'ar';
    try { const l = localStorage.getItem('palmas_lang'); if (l === 'ar' || l === 'en') lang = l; } catch (e) {}
    try { const th = localStorage.getItem('palmas_theme'); document.documentElement.setAttribute('data-theme', th === 'dark' ? 'dark' : 'light'); } catch (e) {}
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    this.setState({ lang });
    this._sync = () => { const P = window.Palmas; if (P) this.setState((s) => ({ ids: P.Compare.list(), tick: s.tick + 1 })); };
    this._onStorage = (e) => {
      if (!e || e.key === 'palmas_compare') this._sync();
      if (e && e.key === 'palmas_lang') this.setState({ lang: e.newValue === 'en' ? 'en' : 'ar' });
    };
    window.addEventListener('palmas:compare', this._sync);
    window.addEventListener('storage', this._onStorage);
    this._boot();
  }
  componentWillUnmount() {
    window.removeEventListener('palmas:compare', this._sync);
    window.removeEventListener('storage', this._onStorage);
    if (this._off) this._off();
    clearTimeout(this._t);
  }
  _boot() {
    const P = window.Palmas;
    if (!P || !P.Compare) { this._t = setTimeout(() => this._boot(), 60); return; }
    /* رابط مقارنة مُشارَك: Compare.dc.html?ids=a,b,c */
    const shared = new URLSearchParams(location.search).get('ids');
    if (shared) P.Compare.set(shared.split(',').map((x) => x.trim()));
    this._sync();
    if (P.API && P.API.onAuthChange) this._off = P.API.onAuthChange(() => this._sync());   // وصول بيانات السيرفر
  }

  renderVals() {
    const P = window.Palmas;
    const lang = this.state.lang || 'ar';
    const ar = lang !== 'en';
    const t = ar ? {
      kicker: 'قارن قبل ما تقرّر', title: 'مقارنة العقارات', legend: 'البند',
      diffOnly: 'الفروقات فقط', addMore: 'أضف عقاراً', share: 'مشاركة المقارنة', copied: 'تم نسخ الرابط ✓',
      ask: 'استفسر عبر واتساب', clear: 'مسح الكل', remove: 'إزالة من المقارنة', bestTag: 'الأفضل',
      emptyTitle: 'ما اخترت عقارات للمقارنة بعد',
      emptyDesc: 'اضغط زر «قارن» على أي عقار في صفحة العقارات أو صفحة العقار نفسه، واختر حتى 4 عقارات لتشوف تفاصيلها جنباً إلى جنب.',
      browse: 'تصفّح العقارات', needMore: 'أضف عقاراً آخر على الأقل حتى تبدأ المقارنة.',
      note: 'الأخضر = الأفضل في البند (أقل سعر، أقل سعر للمتر، أكبر مساحة، عدد غرف أكثر، بناء أحدث). السعر وسعر المتر لا يُقارنان إلا بين عقارات من نفس نوع العرض، وبعد تحويل العملات.',
      sMain: 'السعر والمساحة', sSpecs: 'المواصفات', sLoc: 'الموقع والملكية', sFeat: 'المميزات',
      price: 'السعر', ppsqm: 'سعر المتر المربع', area: 'المساحة', offer: 'نوع العرض', type: 'نوع العقار',
      rooms: 'الغرف', baths: 'الحمامات', floor: 'الطابق', year: 'سنة البناء', parking: 'موقف سيارة',
      city: 'المدينة', loc: 'المنطقة', own: 'نوع الملكية', yes: 'متوفر', no: '—', sqm: 'م²',
      sub: (n, max) => n === 0 ? 'اختر حتى ' + max + ' عقارات' : (n + ' من ' + max + ' عقارات'),
      waIntro: 'مرحباً، أقارن بين هذه العقارات وبدي أستفسر عنها:',
    } : {
      kicker: 'Compare before you decide', title: 'Compare properties', legend: 'Item',
      diffOnly: 'Differences only', addMore: 'Add a property', share: 'Share comparison', copied: 'Link copied ✓',
      ask: 'Ask on WhatsApp', clear: 'Clear all', remove: 'Remove from comparison', bestTag: 'Best',
      emptyTitle: 'No properties selected yet',
      emptyDesc: 'Tap "Compare" on any property in the listings or on a property page, and pick up to 4 to see them side by side.',
      browse: 'Browse properties', needMore: 'Add at least one more property to start comparing.',
      note: 'Green = best in the row (lowest price, lowest price per m², largest area, more rooms, newest build). Price and price per m² are only compared between listings of the same offer type, after currency conversion.',
      sMain: 'Price & size', sSpecs: 'Specifications', sLoc: 'Location & ownership', sFeat: 'Features',
      price: 'Price', ppsqm: 'Price per m²', area: 'Area', offer: 'Offer', type: 'Property type',
      rooms: 'Bedrooms', baths: 'Bathrooms', floor: 'Floor', year: 'Year built', parking: 'Parking',
      city: 'City', loc: 'Area', own: 'Ownership', yes: 'Yes', no: '—', sqm: 'm²',
      sub: (n, max) => n === 0 ? 'Pick up to ' + max + ' properties' : (n + ' of ' + max + ' properties'),
      waIntro: 'Hello, I am comparing these properties and would like to ask about them:',
    };

    const dir = ar ? 'rtl' : 'ltr';
    const base = { dir, t, subtitle: '', hasAny: false, isEmpty: true, needMore: false, canAdd: true, heads: [], rows: [],
      cols: '1fr', diffOnly: this.state.diffOnly, waHref: '#', shareLabel: t.share,
      toggleDiff: () => {}, share: () => {}, clearAll: () => {} };
    if (!P || !P.Compare) return base;

    const L = P.LABELS[lang];
    const props = this.state.ids.map((id) => P.propBy(id)).filter(Boolean);
    const n = props.length;
    const best = P.Compare.best(props);
    const max = P.Compare.MAX;

    const heads = props.map((x) => ({
      slot: 'pp-' + x.id, href: 'PropertyDetails.dc.html?id=' + encodeURIComponent(x.id),
      name: x.name[lang] || x.name.ar, loc: (x.loc && (x.loc[lang] || x.loc.ar)) || '',
      price: P.displayPrice(x, lang),
      offer: x.type === 'land' ? L.offer.landOffer : (L.offer[x.offer] || x.offer),
      remove: () => P.Compare.remove(x.id),
    }));

    const fmtN = (v) => Number(v).toLocaleString('en-US');
    const ppsqm = (x) => x.area > 0 ? P.Currency.format(Math.round(x.price / x.area), x.currency || 'usd', lang) + ' / ' + t.sqm : t.no;
    const row = (key, label, get) => {
      const vals = props.map((x) => { const v = get(x); return (v === null || v === undefined || v === '' || v === 0) ? t.no : String(v); });
      const winners = best[key] || [];
      return {
        isRow: true, isSection: false, label, same: vals.every((v) => v === vals[0]),
        cells: props.map((x, i) => {
          const isBest = winners.indexOf(x.id) !== -1;
          return { value: vals[i], best: isBest, bg: isBest ? 'var(--best-bg)' : 'transparent', fg: isBest ? 'var(--best-fg)' : 'var(--heading)' };
        }),
      };
    };
    const section = (label) => ({ isRow: false, isSection: true, label, cells: [] });

    let rows = [
      section(t.sMain),
      row('price', t.price, (x) => P.displayPrice(x, lang)),
      row('ppsqm', t.ppsqm, ppsqm),
      row('area', t.area, (x) => x.area ? fmtN(x.area) + ' ' + t.sqm : null),
      row('offer', t.offer, (x) => x.type === 'land' ? L.offer.landOffer : L.offer[x.offer]),
      section(t.sSpecs),
      row('type', t.type, (x) => L.type[x.type] || x.type),
      row('rooms', t.rooms, (x) => x.rooms),
      row('baths', t.baths, (x) => x.baths),
      row('floor', t.floor, (x) => x.floor),
      row('year', t.year, (x) => x.year),
      row('parking', t.parking, (x) => x.parking === true ? t.yes : (x.parking > 0 ? x.parking : null)),
      section(t.sLoc),
      row('city', t.city, (x) => { const c = P.cityBy(x.cityKey); return c ? c[lang] : null; }),
      row('loc', t.loc, (x) => x.loc && (x.loc[lang] || x.loc.ar)),
      row('own', t.own, (x) => x.ownership ? L.own[x.ownership] : null),
    ];

    /* المميزات: اتحاد مميزات كل العقارات، وكل عقار ✓ أو — */
    const feats = [];
    props.forEach((x) => (((x.features || {})[lang]) || []).forEach((f) => { if (feats.indexOf(f) === -1) feats.push(f); }));
    if (feats.length) {
      rows.push(section(t.sFeat));
      feats.forEach((f) => rows.push(row('feat', f, (x) => ((((x.features || {})[lang]) || []).indexOf(f) !== -1 ? '✓' : null))));
    }

    if (this.state.diffOnly && n > 1) {
      rows = rows.filter((r) => r.isSection || !r.same);
      rows = rows.filter((r, i) => !r.isSection || (rows[i + 1] && !rows[i + 1].isSection));   // قسم بلا صفوف يُحذف
    }

    const link = location.origin + location.pathname + '?ids=' + props.map((x) => encodeURIComponent(x.id)).join(',');
    const wa = t.waIntro + '\n' + props.map((x) => '• ' + (x.name[lang] || x.name.ar) + ' — ' + P.displayPrice(x, lang)).join('\n') + '\n' + link;

    return Object.assign(base, {
      subtitle: t.sub(n, max), hasAny: n > 0, isEmpty: n === 0, needMore: n === 1, canAdd: n < max,
      /* على الجوال عمود البنود أضيق ليظهر عقار ونصف على الأقل، والباقي بالتمرير */
      heads, rows, cols: (window.innerWidth < 600 ? 'minmax(96px,110px) repeat(' + Math.max(1, n) + ', minmax(180px, 1fr))'
                                                  : 'minmax(150px,190px) repeat(' + Math.max(1, n) + ', minmax(220px, 1fr))'),
      waHref: 'https://wa.me/972595377421?text=' + encodeURIComponent(wa),
      shareLabel: this.state.shared ? t.copied : t.share,
      toggleDiff: (e) => this.setState({ diffOnly: e.target.checked }),
      share: () => {
        const done = () => { this.setState({ shared: true }); setTimeout(() => this.setState({ shared: false }), 2200); };
        if (navigator.share) { navigator.share({ title: t.title, url: link }).catch(() => {}); return; }
        if (navigator.clipboard) navigator.clipboard.writeText(link).then(done).catch(() => {});
      },
      clearAll: () => P.Compare.clear(),
    });
  }
}
</script>
</body>
</html>
