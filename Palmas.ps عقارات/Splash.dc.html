<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes splashGlowPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes splashLogoIn{0%{opacity:0;transform:translateY(14px) scale(.94)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes splashLineExpand{0%{width:0}100%{width:118px}}
@keyframes splashTagIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes splashBarSlide{0%{left:-42%}50%{left:58%}100%{left:-42%}}
</style>
</helmet>
<sc-if value="{{ visible }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:99999;overflow:hidden;background:linear-gradient(168deg,#ffffff 0%,#fdf6ef 48%,#f7ece0 100%);display:flex;align-items:center;justify-content:center;transition:opacity .5s ease,transform .5s ease;opacity:{{ overlayOpacity }};transform:{{ overlayTransform }}">
    <div style="position:absolute;top:-22%;left:-22%;width:78vw;height:78vw;border-radius:50%;background:radial-gradient(circle,rgba(230,126,34,.30),transparent 68%);filter:blur(60px);animation:splashGlowPulse 3.7s ease-in-out infinite"></div>
    <div style="position:absolute;bottom:-24%;right:-20%;width:78vw;height:78vw;border-radius:50%;background:radial-gradient(circle,rgba(230,126,34,.18),transparent 68%);filter:blur(60px);animation:splashGlowPulse 3.7s ease-in-out infinite;animation-delay:.6s"></div>
    <div style="position:absolute;inset:0;opacity:.075;background-image:repeating-linear-gradient(45deg,#c9660b 0,#c9660b 1.5px,transparent 1.5px,transparent 26px),repeating-linear-gradient(-45deg,#c9660b 0,#c9660b 1.5px,transparent 1.5px,transparent 26px)"></div>
    <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:0">
      <img src="uploads/palmas-logo-dark.png" alt="PALMAS.ps" style="width:212px;height:auto;animation:splashLogoIn 1s cubic-bezier(.25,.8,.35,1) both">
      <div style="width:118px;height:1.5px;margin-top:22px;background:linear-gradient(90deg,transparent,#f68743,transparent);animation:splashLineExpand .6s ease .5s both"></div>
      <div style="margin-top:16px;font-size:13.5px;font-weight:700;color:#6d5844;letter-spacing:.3px;opacity:0;animation:splashTagIn .6s ease .9s forwards">بيتك يبدأ من هنا</div>
      <div style="position:relative;margin-top:26px;width:96px;height:2.5px;border-radius:2px;background:rgba(109,88,68,.12);overflow:hidden">
        <div style="position:absolute;top:0;left:0;width:42%;height:100%;background:#f68743;border-radius:2px;animation:splashBarSlide 1.15s ease-in-out infinite"></div>
      </div>
    </div>
    <div style="position:absolute;bottom:38px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:2px;color:rgba(109,88,68,.42)">PALMAS.PS</div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { show: false, hide: false };
  componentDidMount() {
    let seen = false;
    try { seen = sessionStorage.getItem('palmas_splash_seen') === '1'; } catch (e) {}
    if (seen) return;
    try { sessionStorage.setItem('palmas_splash_seen', '1'); } catch (e) {}
    this.setState({ show: true });
    this._t1 = setTimeout(() => this.setState({ hide: true }), 2300);
    this._t2 = setTimeout(() => this.setState({ show: false }), 2820);
  }
  componentWillUnmount() {
    clearTimeout(this._t1); clearTimeout(this._t2);
  }
  renderVals() {
    const hide = this.state.hide;
    return {
      visible: this.state.show,
      overlayOpacity: hide ? 0 : 1,
      overlayTransform: hide ? 'scale(1.045)' : 'scale(1)'
    };
  }
}
</script>
</body>
</html>
